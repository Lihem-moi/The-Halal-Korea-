<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Halal Korea</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HalalKorea">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        /* ... garde ton style actuel ... */
        :root { --primary-color: #2e7d32; }
        body { margin: 0; padding: 0; font-family: sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; }
        .header-info {
            position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: white; padding: 12px 20px;
            border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-weight: bold; width: 80%; text-align: center; color: var(--primary-color);
        }
    </style>
</head>
<body>

    <div class="header-info">🕌 The Halal Korea</div>
    <div id="map"></div>
    <button class="locate-btn" onclick="findMe()">📍</button>

    <script>
        // Initialisation de la carte
        var map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 12);

        // Design de la carte (Clair et moderne)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '©OpenStreetMap'
        }).addTo(map);

        // Liste des lieux de départ
        var locations = [
            { name: "Grande Mosquée de Séoul", lat: 37.5332, lng: 126.9977, type: "Mosquée", info: "Itaewon" },
            { name: "Lotte World Prayer Room", lat: 37.5111, lng: 127.0982, type: "Prière", info: "3ème étage" }
        ];

        // Icône personnalisée verte
        var greenIcon = new L.Icon({
          iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
          shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
          iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        // Ajouter les marqueurs
        locations.forEach(function(place) {
            L.marker([place.lat, place.lng], {icon: greenIcon}).addTo(map)
             .bindPopup(`<b>${place.name}</b><br>${place.type}<br><small>${place.info}</small>`);
        });

        // Fonction de géolocalisation
        function findMe() {
            map.locate({setView: true, maxZoom: 16});
        }

        map.on('locationfound', function(e) {
            L.circle(e.latlng, e.accuracy, {color: 'blue', fillOpacity: 0.1}).addTo(map);
            L.marker(e.latlng).addTo(map).bindPopup("Vous êtes ici").openPopup();
        });

        map.on('locationerror', function() {
            alert("Veuillez activer la localisation sur votre téléphone.");
        });
    </script>
</body>
</html>
